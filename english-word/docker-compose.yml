version: '3.8'
services:
  frontend:
    build: ./rob_english_word_front
    ports:
      - "6111:80"
    depends_on:
      - backend

  backend:
    build: ./rob_english_word_back
    ports:
      - "10111:8019"
      - "10112:9091"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SERVER_PORT=8019
      - NETTY_WEBSOCKET_PORT=9091
      - SPRING_DATASOURCE_URL=jdbc:postgresql://${ROB_WORD_DB_HOST:-100.120.144.76}:${ROB_WORD_DB_PORT:-5432}/${ROB_WORD_DB_NAME:-study_workbench}
      - SPRING_DATASOURCE_USERNAME=${ROB_WORD_DB_USER:-sw_english_runtime}
      - SPRING_DATASOURCE_PASSWORD=${ROB_WORD_DB_PASSWORD:?use --env-file .env.local}
      - SPRING_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - WORD_AGENT_BASE_URL=http://host.docker.internal:8010
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  redis_data:
