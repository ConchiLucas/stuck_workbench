server { listen 80; root /usr/share/nginx/html; index index.html;
    resolver 127.0.0.11 valid=10s ipv6=off;
  location /api/ { set $learning_upstream poem-server:19161;
        proxy_pass http://$learning_upstream; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
  location = /index.html { add_header Cache-Control "no-store"; }
  location / { try_files $uri $uri/ /index.html; }
}
