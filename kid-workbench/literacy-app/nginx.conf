server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Live practice media comes from the material service, independently of tasks.
    location ~ ^/api/v1/literacy/items/([0-9]+)/(glyph\.png|sense\.png|speech\.mp3)$ {
        set $material_upstream content-admin:19091;
        rewrite ^/api/v1/literacy/items/([0-9]+)/(.*)$ /api/v1/literacy/chars/$1/$2 break;
        proxy_pass http://$material_upstream;
    }

    location /api/ {
        set $learning_upstream literacy-server:19151;
        proxy_pass http://$learning_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
