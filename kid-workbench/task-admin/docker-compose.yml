# Standalone launch for task-admin only.
# Prefer `cd .. && make up` so postgres + task-admin share one compose stack.

services:
  app:
    build:
      context: ..
      dockerfile: task-admin/Dockerfile
    ports:
      - "19201:19201"
    environment:
      APP_ADDR: :19201
      APP_LITERACY_SERVER_URL: http://host.docker.internal:19151
      APP_LITERACY_APP_URL: http://host.docker.internal:19152
      APP_CONTENT_ADMIN_URL: ${APP_CONTENT_ADMIN_URL:-http://host.docker.internal:19091}
      APP_AUTO_REVIEW_ENABLED: "false"
      APP_WRITING_ENABLED: ${APP_WRITING_ENABLED:-true}
      APP_DB_HOST: ${APP_DB_HOST:-host.docker.internal}
      APP_DB_PORT: ${APP_DB_PORT:-15432}
      APP_DB_USER: ${APP_DB_USER:-conchi}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-conchi123456}
      APP_DB_NAME: ${APP_DB_NAME:-study_workbench}
      APP_DB_CONFIG: sslmode=disable
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
